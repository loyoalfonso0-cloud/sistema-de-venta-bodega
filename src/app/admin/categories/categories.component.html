<div class="panel">
  <div class="toolbar">
    <h2>Categorías</h2>
    <button class="btn-primary" (click)="openModal()">+ Nueva Categoría</button>
  </div>

  <div class="cards-grid">
    @for (cat of categories(); track cat.id) {
      <div class="category-card">
        <h3>{{ cat.name }}</h3>
        <p>{{ cat.description }}</p>
        <div class="card-footer">
          <span class="product-count">{{ cat.productCount }} productos</span>
          <button class="btn-action danger" (click)="deleteCategory(cat.id, cat.productCount)" title="Eliminar">🗑️</button>
        </div>
      </div>
    } @empty {
      <div class="empty-state">No se encontraron categorías.</div>
    }
  </div>
</div>

@if (isModalOpen()) {
  <div class="modal-backdrop" (click)="closeModal()"></div>
  <aside class="modal-panel slide-in">
    <div class="modal-header">
      <h2>Nueva Categoría</h2>
      <button class="btn-close" (click)="closeModal()">✖</button>
    </div>
    
    <div class="modal-body">
      <form [formGroup]="categoryForm" (ngSubmit)="saveCategory()" class="admin-form">
        <div class="form-group">
          <label for="name">Nombre de Categoría</label>
          <input type="text" id="name" formControlName="name" class="input-text">
        </div>
        
        <div class="form-group">
          <label for="desc">Descripción</label>
          <input type="text" id="desc" formControlName="description" class="input-text">
        </div>

        <div class="form-actions">
          <button type="button" class="btn-outline" (click)="closeModal()">Cancelar</button>
          <button type="submit" class="btn-primary" [disabled]="categoryForm.invalid">Guardar</button>
        </div>
      </form>
    </div>
  </aside>
}
